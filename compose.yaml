services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: searchlite
      POSTGRES_USER: searchlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchlite -d searchlite"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://searchlite:${POSTGRES_PASSWORD:-local_dev_only_password}@db:5432/searchlite
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20
volumes:
  db_data:
